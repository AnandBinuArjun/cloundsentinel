name: CloudSentinel Isolated Cloud Lab (Prowler)

# Manual, approval-gated workflow ONLY.
# NEVER triggered on pull requests or pushes. Requires human-approved isolated sandbox
# OIDC credentials configured in the `cloud-lab-sandbox` GitHub Environment.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Sandbox provider to scan (aws or azure)"
        required: true
        type: choice
        options:
          - aws
          - azure

permissions:
  contents: read
  id-token: write

jobs:
  prowler-sandbox-assessment:
    name: Prowler Read-Only Sandbox Assessment
    runs-on: ubuntu-latest
    environment: cloud-lab-sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Prowler
        run: pip install prowler==5.2.0

      - name: Run Prowler against isolated sandbox (read-only)
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          echo "Running read-only Prowler assessment for isolated sandbox provider: ${PROVIDER}"
          prowler "${PROVIDER}" --output-formats json-ocsf --output-directory prowler-output || true

      - name: Upload Prowler sandbox report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prowler-sandbox-report-${{ inputs.provider }}
          path: prowler-output/
          if-no-files-found: warn
