name: CloudSentinel CI

# Supply-chain security: all third-party GitHub Actions are pinned to reviewed,
# immutable 40-character commit SHAs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]

permissions:
  contents: read

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Types, SAST & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudsentinel_test
          POSTGRES_USER: cloudsentinel
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies & security linters
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" bandit==1.8.3 pip-audit==2.8.0

      - name: Ruff format check
        run: ruff format --check apps packages cloud_connectors detections compliance tests database/seeds

      - name: Ruff lint
        run: ruff check apps packages cloud_connectors detections compliance tests database/seeds

      - name: Mypy strict type check
        run: mypy apps packages cloud_connectors detections compliance

      - name: Bandit SAST scan
        run: bandit -r apps packages cloud_connectors detections compliance -ll

      - name: Python dependency vulnerability audit (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off

      - name: Apply Alembic migrations against PostgreSQL 16 (including RLS)
        env:
          DATABASE_URL: postgresql+asyncpg://cloudsentinel:ci_ephemeral_password@127.0.0.1:5432/cloudsentinel_test
        run: alembic -c database/migrations/alembic.ini upgrade head

      - name: Run unit, integration & security tests
        env:
          CLOUDSENTINEL_ENV: test
          DATABASE_URL: postgresql+asyncpg://cloudsentinel:ci_ephemeral_password@127.0.0.1:5432/cloudsentinel_test
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -v -m "not cloud_lab"

  frontend-quality-and-build:
    name: Frontend Typecheck, Audit, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Audit frontend dependencies (high/critical)
        run: npm audit --audit-level=high

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  security-and-infra-checks:
    name: Secret, SAST, OPA, Terraform, Checkov & Trivy Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12 for Semgrep & Checkov
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Semgrep SAST scan (direct CLI, blocking)
        run: |
          python -m pip install --upgrade pip semgrep==1.99.0
          semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten --error apps packages cloud_connectors detections compliance

      - name: Install & test OPA Rego policies
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.0.1

      - name: Run OPA unit tests
        run: opa test policies/opa -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5

      - name: Validate AWS & Azure Terraform lab formatting and syntax
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          terraform -chdir=infrastructure/terraform/aws init -backend=false
          terraform -chdir=infrastructure/terraform/aws validate
          terraform -chdir=infrastructure/terraform/azure init -backend=false
          terraform -chdir=infrastructure/terraform/azure validate

      - name: Checkov Dockerfile & IaC scan (blocking)
        uses: bridgecrewio/checkov-action@83b08f51b20950f791f5caadcc92e336b371eb12 # v12.3143.0
        with:
          directory: infrastructure
          framework: dockerfile,terraform
          soft_fail: false

      - name: Build API container image for Trivy scan
        run: docker build -f infrastructure/docker/Dockerfile.api -t cloudsentinel-api:ci .

      # Runs Trivy from its official pinned container image rather than a third-party
      # action (the action's setup-trivy dependency tag was removed upstream).
      - name: Trivy container vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:0.58.2 image \
            --ignore-unfixed --severity CRITICAL,HIGH \
            --format json --output /out/trivy-report.json cloudsentinel-api:ci
          python3 - <<'PY'
          import json, sys
          report = json.load(open("trivy-report.json"))
          findings = []
          for result in report.get("Results", []):
              for v in result.get("Vulnerabilities") or []:
                  findings.append((result.get("Target"), v))
          for target, v in findings:
              print(
                  f"::error title=Trivy {v['Severity']}::{v['VulnerabilityID']} "
                  f"{v['PkgName']} {v['InstalledVersion']} -> fixed in "
                  f"{v.get('FixedVersion', 'n/a')} ({target} {v.get('PkgPath', '')})"
              )
          print(f"Trivy fixable HIGH/CRITICAL findings: {len(findings)}")
          sys.exit(1 if findings else 0)
          PY
